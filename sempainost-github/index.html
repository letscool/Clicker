<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семпайность — майнинг-кликер</title>
<style>
:root{--bg:#eef1f6;--fg:#12151c;--card:#ffffff;--line:#cfd6e3;--acc:#0a7fd1;--gold:#b8860b;--mut:#5b6577;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d12;--fg:#e8ecf5;--card:#141824;--line:#262d40;--acc:#2bb5ff;--gold:#ffd23f;--mut:#8791a8}}
:root[data-theme="dark"]{--bg:#0b0d12;--fg:#e8ecf5;--card:#141824;--line:#262d40;--acc:#2bb5ff;--gold:#ffd23f;--mut:#8791a8}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 12px 28px;-webkit-user-select:none;user-select:none}
h1{margin:0;font-size:22px;letter-spacing:1px}
.sub{color:var(--mut);font-size:12px;margin-top:-8px}
.bal{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:700;color:var(--gold)}
.bal img{width:38px;height:auto;image-rendering:pixelated}
.stats{color:var(--mut);font-size:13px;text-align:center}
.pc{position:relative;width:min(640px,100%);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pc img.body{width:100%;display:block;image-rendering:pixelated;pointer-events:none;-webkit-user-drag:none}
.pc canvas{position:absolute;left:4.1%;top:5.9%;width:67.6%;height:51.8%;image-rendering:pixelated;pointer-events:none}
.pc:active img.body{transform:scale(.99)}
.pop{position:absolute;pointer-events:none;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:4px;animation:up .9s ease-out forwards;text-shadow:0 1px 2px #000}
.pop img{width:20px;image-rendering:pixelated}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.shop{width:min(640px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.up{background:var(--card);border:1px solid var(--line);color:var(--fg);font:inherit;text-align:left;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.up b{font-size:14px}.up span{font-size:12px;color:var(--mut)}
.up .cost{color:var(--gold);font-size:13px}
.up:disabled{opacity:.45;cursor:not-allowed}
.up:not(:disabled):hover{border-color:var(--acc)}
.row{display:flex;gap:10px}
.row button{font:inherit;font-size:12px;background:none;color:var(--mut);border:1px solid var(--line);padding:6px 12px;cursor:pointer}
</style>
</head>

var UPS=[
{id:'mouse',n:'Игровая мышь',d:'+1 за клик',base:15,g:1.5,click:1},
{id:'gpu',n:'Видеокарта',d:'+1 в секунду',base:50,g:1.15,cps:1},
{id:'farm',n:'Майнинг-ферма',d:'+8 в секунду',base:400,g:1.15,cps:8},
{id:'rig',n:'Квантовый риг',d:'+50 в секунду',base:3000,g:1.15,cps:50},
{id:'dc',n:'Дата-центр «Семпай»',d:'+300 в секунду',base:20000,g:1.15,cps:300}
];
var S={coins:0,blocks:0,prog:0,own:{}};
try{var sv=JSON.parse(localStorage.getItem('sempai-save'));if(sv&&typeof sv.coins==='number')S=sv}catch(e){}
S.own=S.own||{};
function cost(u){return Math.ceil(u.base*Math.pow(u.g,S.own[u.id]||0))}
function perClick(){var p=1;UPS.forEach(function(u){if(u.click)p+=u.click*(S.own[u.id]||0)});return p}
function cps(){var p=0;UPS.forEach(function(u){if(u.cps)p+=u.cps*(S.own[u.id]||0)});return p}
function fmt(n){if(n<1e4)return Math.floor(n).toLocaleString('ru-RU');var s=['','К','М','Б','Т'],i=0;while(n>=1000&&i<4){n/=1000;i++}return n.toFixed(2)+s[i]}
var el=function(i){return document.getElementById(i)};
var shop=el('shop'),btns={};
UPS.forEach(function(u){
var b=document.createElement('button');b.className='up';
b.onclick=function(){var c=cost(u);if(S.coins>=c){S.coins-=c;S.own[u.id]=(S.own[u.id]||0)+1;ui();save()}};
shop.appendChild(b);btns[u.id]=b;
});
function ui(){
el('coins').textContent=fmt(S.coins);el('pc').textContent=fmt(perClick());el('cps').textContent=fmt(cps());el('blk').textContent=S.blocks;
UPS.forEach(function(u){var b=btns[u.id],c=cost(u);b.disabled=S.coins<c;
b.innerHTML='<b>'+u.n+' ×'+(S.own[u.id]||0)+'</b><span>'+u.d+'</span><span class="cost">'+fmt(c)+' семп</span>'});
}
function save(){try{localStorage.setItem('sempai-save',JSON.stringify(S))}catch(e){}}
/* sound */
var muted=false,pool=[],pi=0;
for(var i=0;i<6;i++){var a=new Audio(SND);a.preload='auto';pool.push(a)}
function beep(){if(muted)return;var a=pool[pi++%pool.length];try{a.currentTime=0;var p=a.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
el('mute').onclick=function(){muted=!muted;this.textContent='Звук: '+(muted?'выкл':'вкл')};
el('reset').onclick=function(){if(confirm('Сбросить весь прогресс?')){S={coins:0,blocks:0,prog:0,own:{}};save();ui()}};
/* mining */
var box=el('pcbox'),burst=0,cr=0,flash=0;
function gain(n){S.coins+=n;S.prog+=n;
if(S.prog>=100+S.blocks*20){S.prog=0;S.blocks++;var bonus=Math.round(20+S.blocks*5+cps()*3);S.coins+=bonus;flash=1.6;lines.push({t:'*** БЛОК #'+S.blocks+' НАЙДЕН  +'+bonus+' СЕМП ***',c:'#ffd23f'})}}
box.addEventListener('pointerdown',function(e){
e.preventDefault();
var n=perClick();gain(n);beep();burst+=6;cr+=2;
var r=box.getBoundingClientRect(),p=document.createElement('div');p.className='pop';
p.style.left=(e.clientX-r.left-12)+'px';p.style.top=(e.clientY-r.top-20)+'px';
p.innerHTML='<img src="'+COIN+'" alt="">+'+fmt(n);box.appendChild(p);setTimeout(function(){p.remove()},900);
ui();
});
/* screen */
var cv=el('scr'),x=cv.getContext('2d'),lines=[],acc=0;
function hex(n){var s='';while(n--)s+='0123456789abcdef'[Math.random()*16|0];return s}
function addLine(){var ok=Math.random()<0.06;lines.push(ok?{t:'0x'+hex(14)+' nonce '+(Math.random()*1e6|0)+' ОК',c:'#5dff8a'}:{t:'0x'+hex(14)+' nonce '+(Math.random()*1e6|0),c:'#2a8fc4'});if(lines.length>40)lines.shift()}
function draw(){
x.fillStyle='#02070d';x.fillRect(0,0,435,251);
x.font='bold 12px ui-monospace,Menlo,Consolas,monospace';x.textBaseline='top';
x.fillStyle='#2bb5ff';x.fillText('> СЕМПАЙНОСТЬ MINER v1.0',8,6);
var hr=(cps()+perClick()*cr)*137;
x.fillStyle='#8fd8ff';x.font='11px ui-monospace,Menlo,Consolas,monospace';
x.fillText('хешрейт: '+fmt(hr)+' H/s   блок #'+(S.blocks+1),8,22);
var vis=11,start=Math.max(0,lines.length-vis);
for(var i=start;i<lines.length;i++){x.fillStyle=lines[i].c;x.fillText(lines[i].t,8,42+(i-start)*14)}
var need=100+S.blocks*20,pr=Math.min(1,S.prog/need);
x.strokeStyle='#2bb5ff';x.strokeRect(8.5,226.5,418,14);
x.fillStyle=flash>0?'#ffd23f':'#2bb5ff';x.fillRect(10,228,Math.max(0,415*pr),11);
x.fillStyle='#02070d';x.fillText(Math.floor(pr*100)+'%',200,228);
if(flash>0){x.fillStyle='rgba(255,210,63,'+Math.min(.25,flash*.15)+')';x.fillRect(0,0,435,251)}
}
var last=performance.now(),ut=0,st=0;
function loop(t){
var dt=Math.min(.25,(t-last)/1000);last=t;
var c=cps();if(c>0)gain(c*dt);
cr-=cr*2*dt;if(cr<0)cr=0;flash=Math.max(0,flash-dt);
acc+=dt*(5+Math.min(40,c/2)+burst*0);if(burst>0){var b=Math.min(burst,3);burst-=b;for(var i=0;i<b;i++)addLine()}
while(acc>0.12){acc-=0.12;addLine()}
ut+=dt;if(ut>.15){ut=0;ui()}
st+=dt;if(st>5){st=0;save()}
draw();requestAnimationFrame(loop);
}
for(var i=0;i<10;i++)addLine();
ui();requestAnimationFrame(loop);
window.addEventListener('beforeunload',save);
})();
